name: Не дати GitHub вимкнути перевірку

# У публічному репозиторії GitHub сам вимикає розклад, якщо 60 днів не було
# жодної активності. Раз на місяць лишаємо слід, щоб моніторинг не зник тихо.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keepalive for the scheduled check" || exit 0
          git push
