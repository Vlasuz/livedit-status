name: Чи працює сервіс

on:
  schedule:
    # Кожні 10 хвилин. GitHub запускає розклад із затримкою до кількох хвилин.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      simulate_outage:
        description: "Перевірити тривогу: вдати, що сервіс лежить"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Перевірки
        env:
          # Лише для ручної перевірки тривоги: сервіс підмінено неіснуючою адресою.
          CHECK_API: ${{ inputs.simulate_outage && 'https://down.livedit-status.invalid' || '' }}
        run: |
          [ -z "$CHECK_API" ] && unset CHECK_API
          ./check.sh
